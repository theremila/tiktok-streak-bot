services:
  tiktok-streak-bot:
    build: .
    container_name: tiktok-streak-bot
    command: ["python", "-u", "main.py", "--oneshot"]
    restart: "no"
    volumes:
      - ./data:/app/data
      - ./data/cookies.json:/app/cookies.json:ro
      - ./data/config.json:/app/config.json:ro
      - ./src:/app/src:ro
    environment:
      - TZ=${TZ:-Europe/Kaliningrad}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
